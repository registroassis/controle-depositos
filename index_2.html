<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Controle de Depósitos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Libre+Caslon+Text:wght@400;700&display=swap">
<style>
/* Layout: livro-razão — menu lateral azul-marinho com filete dourado, área de trabalho clara em colunas tabulares */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --surface-2: #f8f9fb; --ink: #17213a; --muted: #5d667a; --line: #dde1e9; --line-2: #eceef3;
  --navy: #1b2a4a; --navy-2: #24365d; --navy-ink: #e9edf5; --navy-muted: #a9b4c9;
  --gold: #b8963e; --gold-soft: #f6efdd; --gold-ink: #6e5718; --focus: #3d6fd6;
  --pend-bg: #fdf1dc; --pend-fg: #7a4b05; --lanc-bg: #e4eefc; --lanc-fg: #1c4a8c; --util-bg: #e2f3e8; --util-fg: #1d5e35;
  --dup-bg: #efe7fb; --dup-fg: #563092; --conf-bg: #fde6e3; --conf-fg: #8d2a1d; --arq-bg: #eceef2; --arq-fg: #4a5163;
  --danger: #b4321f; --ok: #1f7a43;
  --f-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-brand: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --r: 6px; --shadow: 0 1px 2px rgba(23,33,58,.06), 0 4px 14px rgba(23,33,58,.05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1523; --surface: #161f32; --surface-2: #1b2539; --ink: #e6e9f0; --muted: #9aa3b6; --line: #2a3550; --line-2: #222c43;
  --navy: #0b1220; --navy-2: #16223a; --navy-ink: #e6e9f0; --navy-muted: #8e9ab2;
  --gold: #d4b36c; --gold-soft: #2f2918; --gold-ink: #e6cf98; --focus: #7aa2f7;
  --pend-bg: #3a2b10; --pend-fg: #f4c879; --lanc-bg: #172d4f; --lanc-fg: #9cc1fb; --util-bg: #133222; --util-fg: #8fd8aa;
  --dup-bg: #2b1f45; --dup-fg: #c9b1f5; --conf-bg: #3f1b16; --conf-fg: #f3a597; --arq-bg: #252d3d; --arq-fg: #aab2c3;
  --danger: #f08a78; --ok: #7fd3a0; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1523; --surface: #161f32; --surface-2: #1b2539; --ink: #e6e9f0; --muted: #9aa3b6; --line: #2a3550; --line-2: #222c43;
  --navy: #0b1220; --navy-2: #16223a; --navy-ink: #e6e9f0; --navy-muted: #8e9ab2;
  --gold: #d4b36c; --gold-soft: #2f2918; --gold-ink: #e6cf98; --focus: #7aa2f7;
  --pend-bg: #3a2b10; --pend-fg: #f4c879; --lanc-bg: #172d4f; --lanc-fg: #9cc1fb; --util-bg: #133222; --util-fg: #8fd8aa;
  --dup-bg: #2b1f45; --dup-fg: #c9b1f5; --conf-bg: #3f1b16; --conf-fg: #f3a597; --arq-bg: #252d3d; --arq-fg: #aab2c3;
  --danger: #f08a78; --ok: #7fd3a0; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--focus); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, .mono { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
/* menu lateral */
.side { background: var(--navy); color: var(--navy-ink); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; display: flex; flex-direction: column; border-right: 3px solid var(--gold); padding-left: env(safe-area-inset-left, 0px); }
.brand { padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand small { display: block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.brand b { font-family: var(--f-brand); font-weight: 700; font-size: 19px; line-height: 1.15; display: block; }
.brand span { font-family: var(--f-num); font-size: 11px; color: var(--navy-muted); }
.nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--navy-ink); text-decoration: none; padding: 8px 10px; border-radius: 5px; font-size: 13.5px; }
.nav a:hover { background: var(--navy-2); }
.nav a[aria-current="page"] { background: var(--navy-2); box-shadow: inset 3px 0 0 var(--gold); }
.nav .grp { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--navy-muted); padding: 14px 10px 4px; }
.nav .cnt { font-family: var(--f-num); font-size: 11px; background: rgba(255,255,255,.1); padding: 1px 7px; border-radius: 10px; min-width: 22px; text-align: center; }
.nav .cnt.alerta { background: var(--gold); color: #1b2a4a; }
.side-foot { margin-top: auto; padding: 12px 18px 18px; font-size: 11.5px; color: var(--navy-muted); border-top: 1px solid rgba(255,255,255,.08); }
.side-foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #5fbf85; margin-right: 6px; vertical-align: 1px; }
.side-foot .dot.local { background: var(--gold); }
/* topo móvel */
.topbar { display: none; }
main { min-width: 0; padding-block: 22px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-h h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.page-h p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.eyebrow { font-family: var(--f-num); font-size: 11px; color: var(--gold-ink); background: var(--gold-soft); padding: 2px 8px; border-radius: 3px; display: inline-block; margin-bottom: 6px; letter-spacing: .03em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.panel > header { padding: 12px 16px; border-bottom: 1px solid var(--line-2); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel > header h2 { margin: 0; font-size: 14.5px; font-weight: 600; }
.panel .body { padding: 14px 16px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.hint { font-size: 12.5px; color: var(--muted); }
/* indicadores */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-decoration: none; color: inherit; display: block; position: relative; }
.kpi:hover { border-color: var(--gold); }
.kpi .lab { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kpi .val { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 500; margin-top: 4px; letter-spacing: -.02em; }
.kpi .sub { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.kpi.destaque { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.kpi.destaque .lab, .kpi.destaque .sub { color: var(--navy-muted); }
.kpi.destaque .val { color: #fff; }
.kpi.destaque::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 0; height: 3px; background: var(--gold); }
/* status */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.st-pendente { background: var(--pend-bg); color: var(--pend-fg); }
.st-lancado { background: var(--lanc-bg); color: var(--lanc-fg); }
.st-utilizado { background: var(--util-bg); color: var(--util-fg); }
.st-duplicidade { background: var(--dup-bg); color: var(--dup-fg); }
.st-conferencia { background: var(--conf-bg); color: var(--conf-fg); }
.st-ignorado, .st-cancelado, .st-existente { background: var(--arq-bg); color: var(--arq-fg); }
.tag { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 3px; background: var(--gold-soft); color: var(--gold-ink); font-weight: 600; letter-spacing: .02em; vertical-align: 1px; }
.tag.err { background: var(--conf-bg); color: var(--conf-fg); }
/* botões e formulários */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--navy); border-color: var(--navy); color: #fff; }
:root[data-theme="dark"] .btn.pri { background: var(--gold); border-color: var(--gold); color: #1b2a4a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.pri { background: var(--gold); border-color: var(--gold); color: #1b2a4a; } }
.btn.pri:hover { filter: brightness(1.12); }
.btn.gold { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-ink); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; min-width: 0; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 7px 9px; font-size: 13px; min-width: 0; color: var(--ink); }
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
textarea { width: 100%; resize: vertical; font-family: var(--f-num); font-size: 12.5px; line-height: 1.5; }
.filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); background: var(--surface-2); }
/* tabelas */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
table.t th[data-sort] { cursor: pointer; user-select: none; }
table.t th[data-sort]:hover { color: var(--ink); }
table.t th .ar { font-size: 9px; margin-left: 3px; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.t tr:hover td { background: var(--surface-2); }
table.t td.r, table.t th.r { text-align: right; }
table.t td .num { white-space: nowrap; }
table.t td .acoes { display: flex; flex-wrap: wrap; gap: 4px; min-width: 150px; }
table.t tr.sel td { background: color-mix(in srgb, var(--gold) 10%, var(--surface)); }
table.t input[type=text] { padding: 4px 6px; font-size: 12.5px; width: 100%; min-width: 90px; }
.motivo { color: var(--muted); font-size: 12px; max-width: 46ch; }
.clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rem { font-weight: 500; }
.vazio { padding: 34px 16px; text-align: center; color: var(--muted); }
.vazio b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.pag { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--gold-soft); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--gold-ink); }
.alerta { border: 1px solid var(--gold); background: var(--gold-soft); color: var(--gold-ink); border-radius: var(--r); padding: 10px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; }
.alerta.err { border-color: var(--danger); background: var(--conf-bg); color: var(--conf-fg); }
.alerta.ok { border-color: var(--ok); background: var(--util-bg); color: var(--util-fg); }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tl { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
.tl li { padding: 0 0 12px 14px; position: relative; font-size: 12.5px; }
.tl li::before { content: ""; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--gold); }
.tl time { font-family: var(--f-num); font-size: 11.5px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 92px minmax(0,1fr) 120px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar .trk { height: 10px; background: var(--line-2); border-radius: 5px; overflow: hidden; }
.bar .trk i { display: block; height: 100%; background: var(--gold); border-radius: 5px; }
.bar .v { text-align: right; font-family: var(--f-num); font-size: 12px; }
pre.raw { background: var(--surface-2); border: 1px solid var(--line-2); padding: 8px 10px; border-radius: 5px; font-family: var(--f-num); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 14px; text-align: center; color: var(--muted); font-size: 13px; }
.drop.on { border-color: var(--gold); background: var(--gold-soft); }
/* modal */
.ov { position: fixed; inset: 0; background: rgba(11,18,32,.5); display: flex; align-items: flex-start; justify-content: center; padding: max(40px, env(safe-area-inset-top, 0px)) 16px 24px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 8px; width: min(720px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.3); border-top: 3px solid var(--gold); }
.modal.lg { width: min(980px, 100%); }
.modal > header { padding: 14px 18px; border-bottom: 1px solid var(--line-2); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modal > header h3 { margin: 0; font-size: 16px; }
.modal .body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal > footer { padding: 12px 18px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.x { border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--muted); padding: 0 4px; line-height: 1; }
.toast { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); background: var(--navy); color: #fff; padding: 10px 14px; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 60; max-width: min(440px, calc(100vw - 36px)); font-size: 13px; border-left: 3px solid var(--gold); }
.toast.err { border-left-color: #f08a78; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.loading { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }
.doc h3 { font-size: 14px; margin: 16px 0 6px; } .doc p, .doc li { max-width: 78ch; } .doc code { font-family: var(--f-num); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid3 { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: 260px; height: 100%; transform: translateX(-105%); transition: transform .2s; z-index: 40; padding-top: env(safe-area-inset-top, 0px); }
  .side.open { transform: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: #fff; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 2px solid var(--gold); }
  .topbar b { font-family: var(--f-brand); font-size: 16px; }
  .topbar button { background: none; border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 5px; padding: 5px 10px; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 16px; }
  .grid2 { grid-template-columns: minmax(0,1fr); }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 35; }
}
@media (max-width: 520px) { .kpis { grid-template-columns: minmax(0, 1fr); } .bar { grid-template-columns: 70px minmax(0,1fr) 96px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="firebase-config.js"></script>

<script>
/* Controle de Depósitos – núcleo (regras de negócio, persistência, backup)
 * Módulo puro: roda no navegador (window.Core) e no Node (module.exports) para testes.
 */
(function (global) {
  'use strict';

  const APP_NOME = 'Controle de Depósitos – RI Assis';
  const APP_VERSAO = '1.0.0';
  const BACKUP_FORMATO = 'controle-depositos-ri-assis';
  const BACKUP_VERSAO = 1;
  const CHUNK_MAX = 180000; // bytes por documento (limite do banco: 256 KiB)

  // ------------------------------------------------------------------ util
  const stripAccents = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const up = (s) => stripAccents(s).toUpperCase();
  const norm = (s) => up(s).replace(/[^A-Z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  const STOP = new Set(['LTDA', 'ME', 'EPP', 'SA', 'EIRELI', 'DE', 'DA', 'DO', 'DAS', 'DOS', 'E', 'S', 'A', 'CIA']);
  const nameTokens = (s) => norm(s).split(' ').filter((w) => w && !STOP.has(w));
  const normRef = (r) => (r == null ? null : String(r).replace(/\D/g, '').replace(/^0+/, '') || null);
  const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
  const pad = (n, w) => String(n).padStart(w, '0');

  function uid(prefix) {
    let r = '';
    try {
      const a = new Uint8Array(8);
      (global.crypto && global.crypto.getRandomValues ? global.crypto : require('crypto').webcrypto).getRandomValues(a);
      r = Array.from(a, (b) => b.toString(36).padStart(2, '0')).join('').slice(0, 12);
    } catch (e) { r = Math.random().toString(36).slice(2, 14); }
    return (prefix || 'x') + '_' + Date.now().toString(36) + r;
  }

        const comeca = /^(REM|REMETENTE|DES)\s*:/i.test(up(log.texto));
        if (!r.erro.startsWith('Valor em formato') && ult && !temDataCompleta && ult.continuacoes < 2 &&
          (!ult.reg.remetente || (comeca && !/\b(REM|DES)\s*:/.test(up(ult.log.texto))))) {
          // linha de continuação (ex.: "REM: NOME 27/10" abaixo de "TRANSFERENCIA PIX ... 957,34")
          ult.log = { linha: ult.log.linha, bruto: ult.log.bruto + ' | ' + log.bruto, texto: ult.log.texto + ' ' + log.texto, nat: ult.log.nat };
          ult.continuacoes++;
          const novo = montarRegistro(ult.log, Object.assign({}, ctx, { dataAnterior: ult.ctxData }));
          registros[registros.length - 1] = novo; ult.reg = novo;
          continue;
        }
        if (r.erro.startsWith('Valor em formato') || pendente) { flushPendente(); }
        if (r.erro.startsWith('Valor em formato')) { invalidas.push({ linha: n, bruto, motivo: r.erro }); ult = null; continue; }
        pendente = { linha: n, bruto: bruto.trim(), texto: log.texto, erro: r.erro };
        continue;
      }
      if (pendente) {
        const sepAtual = separarTipo(log.texto);
        if (!sepAtual.tipo && !/\b(REM|DES)\s*:/.test(up(log.texto)) || /^(REM|REMETENTE)\s*:/i.test(log.texto)) {
          log = { linha: pendente.linha, bruto: pendente.bruto + ' | ' + log.bruto, texto: pendente.texto + ' ' + log.texto, nat: log.nat };
          pendente = null;
          r = montarRegistro(log, ctx);
        } else flushPendente();
      }
      if (r.erro) { invalidas.push({ linha: n, bruto, motivo: r.erro }); ult = null; continue; }
      if (r.natureza === 'D') { ignoradas.push({ linha: n, bruto, motivo: 'Débito (não é crédito)' }); ult = null; if (r.data) ctx.dataAnterior = r.data; continue; }
      const ctxData = ctx.dataAnterior;
      if (r.data && r.dataTexto && RE_DATA_COMPLETA.test(r.dataTexto)) ctx.dataAnterior = r.data;
      registros.push(r);
      ult = { reg: r, log, continuacoes: 0, ctxData };
    }
    flushPendente();
    return { registros, invalidas, ignoradas };
  }

  /** Converte linhas (arrays de células) de CSV/Excel em texto TAB para o interpretador. */
  function celulasParaTexto(linhas) {
    return linhas.map((cells) => cells.map((c) => {
      if (c == null) return '';
      if (typeof c === 'number') return Number.isInteger(c) && Math.abs(c) >= 1000 && Math.abs(c) < 1e12 && String(c).length >= 3 ? String(c) : formatBRL(Math.round(c * 100), true);
      return String(c).replace(/[\t\n\r]+/g, ' ').trim();
    }).join('\t')).join('\n');
  }

  /** Converte um arquivo OFX (exportação do internet banking) em linhas de texto do extrato (somente créditos). */
  function ofxParaTexto(ofx) {
    const s = String(ofx || '');
    const blocos = s.split(/<STMTTRN>/i).slice(1);
    const tag = (b, t) => { const m = b.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
    const out = [];
    for (const b of blocos) {
      const amt = parseFloat(tag(b, 'TRNAMT').replace(',', '.'));
      if (!Number.isFinite(amt)) continue;
      const dt = tag(b, 'DTPOSTED');
      const data = /^\d{8}/.test(dt) ? dt.slice(6, 8) + '/' + dt.slice(4, 6) + '/' + dt.slice(0, 4) : '';
      const memo = (tag(b, 'MEMO') || tag(b, 'NAME')).replace(/\s+/g, ' ');
      const doc = (tag(b, 'CHECKNUM') || tag(b, 'REFNUM') || '').replace(/\D/g, '');
      const v = formatBRL(Math.round(Math.abs(amt) * 100), true);
      out.push([data, memo, doc, (amt < 0 ? '-' : '') + v].filter(Boolean).join(' '));
    }
    return out.join('\n');
  }

  // ------------------------------------------------------------------ planilha (histórico)
  function extrairIdentificacao(ident) {
    let s = String(ident == null ? '' : ident).replace(/[\s\u00a0]+/g, ' ').trim();
    s = s.replace(/\s+-?\s*R?\$?\s?\d{1,3}(\.\d{3})*,\d{2}\s*$/, '').trim();
    const m = s.match(/^(.*?)[\s\-–:]*(?:\bID\s*[-:]?\s*|\bP\.\s*)?(\d{3,})\s*$/i);
    if (m && m[1].trim()) {
      const rem = m[1].replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g, '').replace(/[\s\-–:]+$/, '').replace(/\bID\s*[-:]?$/i, '').replace(/[\s\-–:]+$/, '').trim();
      return { remetente: rem, referencia: m[2] };
    }
    return { remetente: s.replace(/[\s\-–:]+$/, ''), referencia: null };
  }

  /**
   * Lê a planilha atual (array de linhas com células cruas; datas como número serial do Excel).
   * Retorna { cabecalho:{linha, colunaInicial, nomes[], mapa{campo:indice}}, linhas[], invalidas[], faltando[] }
   */
  function lerPlanilha(aoa, opts) {
    opts = opts || {};
    let hr = -1;
    for (let i = 0; i < Math.min(aoa.length, 40); i++) {
      const row = aoa[i] || [];
      const hits = row.filter((c) => typeof c === 'string' && autoMapear(c)).length;
      if (hits >= 3) { hr = i; break; }
    }
    if (hr < 0) return { erro: 'Não encontrei a linha de cabeçalho (ex.: "DATA DO DEPÓSITO", "IDENTIFICAÇÃO", "VALOR") nas 40 primeiras linhas.' };
    const row = aoa[hr];
    let c0 = row.findIndex((c) => c != null && String(c).trim() !== '');
    let c1 = row.length - 1; while (c1 > c0 && (row[c1] == null || String(row[c1]).trim() === '')) c1--;
    const nomes = []; const mapa = {};
    for (let c = c0; c <= c1; c++) {
      const nome = row[c] == null ? '' : String(row[c]).trim();
      nomes.push(nome);
      const campo = opts.mapa && opts.mapa[nome] !== undefined ? opts.mapa[nome] : autoMapear(nome);
      if (campo && mapa[campo] === undefined) mapa[campo] = c;
    }
    const faltando = ['dataDeposito', 'identificacao', 'valor'].filter((k) => mapa[k] === undefined);
    const cabecalho = { linha: hr + 1, colunaInicial: c0 + 1, nomes, mapa };
    if (faltando.length) return { cabecalho, faltando, linhas: [], invalidas: [] };
    const g = (r, k) => (mapa[k] === undefined ? null : r[mapa[k]]);
    const data = (v) => (typeof v === 'number' ? excelSerialToISO(v) : v instanceof Date ? validISO(v.getFullYear(), v.getMonth() + 1, v.getDate()) : parseDateBR(String(v || '').trim()));
    const txt = (v) => (v == null ? '' : String(v).replace(/[\t\u00a0]+/g, ' ').replace(/\s+/g, ' ').trim());
    const linhas = [], invalidas = [];
    for (let i = hr + 1; i < aoa.length; i++) {
      const r = aoa[i] || [];
      if (!r.some((c) => c != null && String(c).trim() !== '')) continue;
      const dd = g(r, 'dataDeposito'), id = g(r, 'identificacao'), vv = g(r, 'valor');
      const dataISO = data(dd);
      const cents = parseMoneyBR(typeof vv === 'string' ? vv.trim() : vv);
      const prot = g(r, 'protocolo');
      let cor = '';
      if (opts.corDe) { cor = opts.corDe(i, mapa.dataDeposito); if (!cor && mapa.identificacao !== undefined) cor = opts.corDe(i, mapa.identificacao); }
      const lin = {
        f: cor || '',
        n: i + 1, d: dataISO, i: txt(id), v: cents,
        p: typeof prot === 'number' ? String(prot) : txt(prot),
        s: txt(g(r, 'solicitante')), dc: data(g(r, 'dataConferencia')), c: txt(g(r, 'conferente')), o: txt(g(r, 'comentario')),
      };
      const probs = [];
      if (!dataISO) { probs.push('data do depósito ilegível: "' + txt(dd) + '"'); lin.dt = txt(typeof dd === 'number' ? String(dd) : dd); }
      if (cents == null) { probs.push('valor ilegível: "' + txt(vv) + '"'); lin.vt = txt(vv); }
      if (!lin.i) probs.push('identificação vazia');
      if (probs.length) { lin.x = probs.join('; '); invalidas.push({ linha: i + 1, motivo: lin.x }); }
      linhas.push(lin);
    }
    return { cabecalho, faltando: [], linhas, invalidas };
  }

  /** Índices de busca sobre o histórico da planilha. */
  function indexarHistorico(linhas) {
    const porRef = new Map(), porValorData = new Map(), porRem = new Map();
    linhas.forEach((l, k) => {
      const ex = extrairIdentificacao(l.i);
      l._rem = ex.remetente; l._ref = normRef(ex.referencia);
      if (l._ref) { if (!porRef.has(l._ref)) porRef.set(l._ref, []); porRef.get(l._ref).push(k); }
      if (l.v != null && l.d) { const kk = l.v + '|' + l.d; if (!porValorData.has(kk)) porValorData.set(kk, []); porValorData.get(kk).push(k); }
      const rk = nameTokens(ex.remetente).slice(0, 3).join(' ');
      if (rk) { if (!porRem.has(rk)) porRem.set(rk, []); porRem.get(rk).push(k); }
    });
    return { porRef, porValorData, porRem };
  }
  const chaveLinhaPlanilha = (l) => [l._ref || '', l.v, l.d || '', norm(l.i)].join('|');

  // ------------------------------------------------------------------ cores da planilha
  const NOMES_COR = { '595959': 'cinza escuro', 'FFFF00': 'amarelo', 'A9D18E': 'verde', 'C5E0B4': 'verde claro' };
  const nomeCor = (rgb) => (!rgb ? 'sem cor' : NOMES_COR[rgb] || '#' + rgb);
  /** Cor de preenchimento de uma célula lida pelo SheetJS com cellStyles (rgb sem alfa, ou '' quando não pintada). */
  function corDaCelula(cell) {
    const s = cell && cell.s;
    if (!s || !s.patternType || s.patternType === 'none' || !s.fgColor) return '';
    const rgb = String(s.fgColor.rgb || '').toUpperCase().replace(/^FF(?=[0-9A-F]{6}$)/, '');
    if (!rgb || rgb === 'FFFFFF') return '';
    return rgb;
  }
  function descEvidencia(c) {
    const e = c && c.evidencia; if (!e) return '';
    if (e.descricao) return e.descricao;
    if (e.fonte === 'planilha') { const p = (c.lancamento && c.lancamento.protocolo) || e.protocolo; return 'Planilha FIN - 00, linha ' + e.linha + ' (' + nomeCor(e.cor) + ')' + (p ? ' · protocolo ' + p : ''); }
    return '';
  }
  function statusDaCor(cor, regras) {
    const m = (regras && regras.cores) || {};
    if (!cor) return m[''] || 'lancado';
    return m[cor] || 'utilizado';
  }

  // ------------------------------------------------------------------ classificação
  function chaveCredito(r) {
    const ref = normRef(r.referencia);
    if (ref) return 'R|' + ref + '|' + r.valor + '|' + (r.data || '?');
    return 'N|' + (r.data || '?') + '|' + r.valor + '|' + norm((r.tipo || '') + ' ' + (r.remetente || ''));
  }

  /** Procura evidência de utilização/registro no histórico da planilha. */
  function buscarEvidencia(c, hist, regras, vinculadas) {
    if (!hist || !hist.linhas.length) return { tipo: 'sem-fonte' };
    const ref = normRef(c.referencia);
    const tol = regras.toleranciaDias;
    if (ref) {
      const cands = (hist.idx.porRef.get(ref) || []).map((k) => hist.linhas[k]).filter((l) => l.v === c.valor);
      if (cands.length) {
        const livres = cands.filter((l) => !vinculadas.has(chaveLinhaPlanilha(l)) || vinculadas.get(chaveLinhaPlanilha(l)) === c.id);
        const datados = livres.filter((l) => l.d && c.data).map((l) => ({ l, dd: diasEntre(l.d, c.data) })).sort((a, b) => a.dd - b.dd);
        const perto = datados.filter((x) => x.dd <= tol);
        if (perto.length === 1 || (perto.length > 1 && perto[0].dd < perto[1].dd)) return { tipo: 'match', linha: perto[0].l, dias: perto[0].dd };
        if (perto.length > 1) return { tipo: 'ambiguo', linhas: perto.map((x) => x.l), motivo: 'Mais de uma linha da planilha tem a mesma referência, valor e data próxima (linhas ' + perto.map((x) => x.l.n).join(', ') + ')' };
        const semData = livres.filter((l) => !l.d);
        if (semData.length) return { tipo: 'ambiguo', linhas: semData, motivo: 'Referência e valor coincidem com a linha ' + semData[0].n + ' da planilha, mas a data dessa linha está ilegível' };
        if (datados.length) return { tipo: 'ambiguo', linhas: [datados[0].l], motivo: 'Referência e valor coincidem com a linha ' + datados[0].l.n + ' da planilha (data ' + fmtData(datados[0].l.d) + '), mas a data difere em ' + datados[0].dd + ' dias' };
        if (cands.length > livres.length) return { tipo: 'ja-vinculada', linhas: cands, motivo: 'A linha ' + cands[0].n + ' da planilha com esta referência e valor já está vinculada a outro crédito' };
      }
      const outrosValores = (hist.idx.porRef.get(ref) || []).map((k) => hist.linhas[k]).filter((l) => l.v !== c.valor && l.d && c.data && diasEntre(l.d, c.data) <= tol && similaridade(l._rem, c.remetente) >= regras.similaridadeMinima);
      if (outrosValores.length) return { tipo: 'ambiguo', linhas: outrosValores, motivo: 'A planilha tem a mesma referência e remetente com valor diferente (linha ' + outrosValores[0].n + ': ' + formatBRL(outrosValores[0].v) + ')' };
    }
    if (c.data) {
      const cands = (hist.idx.porValorData.get(c.valor + '|' + c.data) || []).map((k) => hist.linhas[k])
        .filter((l) => !vinculadas.has(chaveLinhaPlanilha(l)) && similaridade(l._rem, c.remetente) >= regras.similaridadeMinima && (!ref || !l._ref || l._ref !== ref));
      if (cands.length) return { tipo: 'parcial', linhas: cands, motivo: 'Possível registro na planilha (linha ' + cands[0].n + ': "' + cands[0].i + '") com mesmo valor, data e remetente semelhante, mas sem código coincidente — não é prova de utilização' };
    }
    return { tipo: 'nenhuma' };
  }

  function evidenciaDeLinha(l, hist, dias) {
    return {
      fonte: 'planilha', arquivo: hist.meta && hist.meta.arquivo, aba: hist.meta && hist.meta.aba,
      linha: l.n, data: l.d, identificacao: l.i, valor: l.v, protocolo: l.p, solicitante: l.s, dataConferencia: l.dc, conferente: l.c, comentario: l.o,
      chave: chaveLinhaPlanilha(l), diferencaDias: dias, cor: l.f || '',
      descricao: 'Linha ' + l.n + ' da planilha (' + nomeCor(l.f) + ')' + (hist.meta && hist.meta.arquivo ? ' "' + hist.meta.arquivo + '"' : '') + ': ' + l.i + ' · ' + formatBRL(l.v) + ' · ' + fmtData(l.d) + (l.p ? ' · protocolo ' + l.p : ' · sem protocolo') + (l.s ? ' · solicitante ' + l.s : ''),
    };
  }

  /** Classifica um crédito (novo ou reprocessado). Retorna {status, motivo, evidencia, dupDe, problemas} */
  function classificar(c, ctx) {
    const { hist, regras, vinculadas, outros } = ctx;
    const problemas = (c.problemas || []).slice();
    // C. duplicidade
    if (c._dupLote) return { status: 'duplicidade', motivo: c._dupLote };
    const ref = normRef(c.referencia);
    for (const o of outros) {
      if (o.id === c.id || o.status === 'cancelado') continue;
      if (ref && normRef(o.referencia) === ref && o.valor === c.valor && o.data !== c.data)
        return { status: 'duplicidade', motivo: 'Mesma referência (' + c.referencia + ') e valor do crédito de ' + fmtData(o.data) + ' já existente (' + STATUS[o.status].curto + ')', dupDe: o.id };
      if (!ref && !normRef(o.referencia) && o.valor === c.valor && o.data === c.data && o.chave !== c.chave && similaridade(o.remetente, c.remetente) >= 0.8)
        return { status: 'duplicidade', motivo: 'Crédito sem código com mesmo valor, data e remetente semelhante a outro já importado', dupDe: o.id };
    }
    // evidência na planilha
    const ev = buscarEvidencia(c, hist, regras, vinculadas);
    if (ev.tipo === 'match') {
      const evid = evidenciaDeLinha(ev.linha, hist, ev.dias);
      if (problemas.length) return { status: 'conferencia', motivo: 'Encontrado na planilha, mas o extrato tem pendências: ' + problemas.join('; '), evidencia: evid };
      const st = statusDaCor(ev.linha.f, regras);
      return {
        status: st, evidencia: evid,
        motivo: (st === 'utilizado' ? 'Utilizado' : st === 'lancado' ? 'Conferido, aguardando utilização' : 'Conferir') + ': linha ' + ev.linha.n + ' da planilha (' + nomeCor(ev.linha.f) + ') com a mesma referência ' + c.referencia + ', valor e data' + (ev.dias ? ' (diferença de ' + ev.dias + ' dia' + (ev.dias > 1 ? 's' : '') + ')' : ''),
      };
    }
    if (ev.tipo === 'ambiguo' || ev.tipo === 'parcial' || ev.tipo === 'ja-vinculada')
      return { status: 'conferencia', motivo: ev.motivo, candidatas: ev.linhas.slice(0, 5).map((l) => evidenciaDeLinha(l, hist)) };
    // D. informações insuficientes
    if (!ref && regras.exigirReferencia) problemas.unshift('Sem código/identificador da transação: não é possível comprovar a utilização nem descartar duplicidade com segurança');
    if (problemas.length) return { status: 'conferencia', motivo: problemas.join('; ') };
    // B. pendente
    const fonte = ev.tipo === 'sem-fonte'
      ? 'Nenhuma planilha/histórico importado ainda: não há dados para comprovar a utilização.'
      : 'Nenhum registro de utilização encontrado na planilha importada (' + hist.linhas.length + ' linhas, até ' + fmtData(hist.meta && hist.meta.ultimaData) + ') nem no aplicativo.';
    return { status: 'pendente', motivo: fonte };
  }

  function sugerirSolicitante(c, hist) {
    if (!hist || !hist.linhas.length) return null;
    const rk = nameTokens(c.remetente).slice(0, 3).join(' ');
    const ks = hist.idx.porRem.get(rk);
    if (!ks || ks.length < 3) return null;
    const cont = new Map();
    const recentes = ks.slice(-40);
    for (const k of recentes) { const s = (hist.linhas[k].s || '').toUpperCase(); if (s) cont.set(s, (cont.get(s) || 0) + 1); }
    let best = null, n = 0, tot = 0;
    for (const [s, q] of cont) { tot += q; if (q > n) { best = s; n = q; } }
    if (!best || n / tot < 0.6) return null;
    return { valor: best, base: n + ' de ' + tot + ' lançamentos recentes deste remetente' };
  }

  function identificacaoPadrao(c, cfg) {
    const ref = c.referencia || '';
    let m = cfg.planilha.modeloIdentificacao || '{REMETENTE} - {REFERENCIA}';
    let s = m.replace('{REMETENTE}', (c.remetente || '').toUpperCase()).replace('{REFERENCIA}', ref).replace('{TIPO}', c.tipo || '');
    return s.replace(/\s*-\s*$/, '').replace(/\s+/g, ' ').trim();
  }

  // ------------------------------------------------------------------ persistência em blocos
  class Conjunto {
    constructor(nome, max) { this.nome = nome; this.max = max || CHUNK_MAX; this.itens = new Map(); this.blocoDe = new Map(); this.blocos = new Map(); this.tam = new Map(); this.sujos = new Set(); this.apagar = new Set(); this.tocados = new Set(); this.tx = null; this.seq = 0; this.versoes = new Map(); }
    carregar(docs) {
      this.itens.clear(); this.blocoDe.clear(); this.blocos.clear(); this.tam.clear(); this.sujos.clear(); this.apagar.clear(); this.tocados.clear(); this.seq = 0;
      this._ultimo = {}; this.versoes = new Map();
      for (const d of docs) { this._aplicarDoc(d.id, d.data, true); this._ultimo[d.id] = JSON.stringify(d.data && d.data.itens); if (d.data && d.data.v) this.versoes.set(d.id, d.data.v); }
    }
    _aplicarDoc(bid, data, inicial) {
      const n = parseInt(String(bid).replace(/\D/g, ''), 10); if (n > this.seq) this.seq = n;
      if (!this.blocos.has(bid)) this.blocos.set(bid, new Set());
      const ids = this.blocos.get(bid);
      // o banco entrega objetos congelados (somente leitura): trabalhamos sempre com cópias
      const itens = data && data.itens ? JSON.parse(JSON.stringify(data.itens)) : {};
      for (const [id, it] of Object.entries(itens)) {
        if (!inicial && this.tocados.has(id)) continue;
        const cur = this.itens.get(id);
        if (!inicial && cur && it && typeof it === 'object' && !Array.isArray(it) && (cur.rev || 0) > (it.rev || 0)) continue;
        const old = this.blocoDe.get(id); if (old && old !== bid && this.blocos.get(old)) this.blocos.get(old).delete(id);
        this.itens.set(id, it); this.blocoDe.set(id, bid); ids.add(id); this.tam.set(id, JSON.stringify(it).length + id.length + 6);
      }
    }
    /** Mescla documentos vindos de outro dispositivo/usuário (sem sobrescrever alterações locais não salvas). */
    mesclarRemoto(docs) {
      this._ultimo = this._ultimo || {}; let mud = false;
      for (const d of docs) {
        const snap = JSON.stringify(d.data && d.data.itens);
        if (this._ultimo[d.id] === snap) continue;
        this._ultimo[d.id] = snap; this._aplicarDoc(d.id, d.data, false); mud = true; if (d.data && d.data.v) this.versoes.set(d.id, d.data.v);
      }
      return mud;
    }
    get(id) { return this.itens.get(id); }
    todos() { return Array.from(this.itens.values()); }
    get tamanho() { return this.itens.size; }
    _reg(id) { if (this.tx && !this.tx.has(id)) this.tx.set(id, { v: this.itens.has(id) ? clone(this.itens.get(id)) : undefined, b: this.blocoDe.get(id) }); }
    _tamBloco(bid) { let s = 0; for (const id of this.blocos.get(bid) || []) s += this.tam.get(id) || 0; return s; }
    _escolherBloco(sz) {
      const ids = Array.from(this.blocos.keys()).sort();
      const last = ids[ids.length - 1];
      if (last && this._tamBloco(last) + sz < this.max) return last;
      this.seq++; const bid = 'b' + pad(this.seq, 4); this.blocos.set(bid, new Set()); return bid;
    }
    put(id, item) {
      this._reg(id);

          if (cands.length === 1) ex = cands[0];
        }
        if (ex && ex.origem === 'planilha') { usadosPrevia.add(ex.id); itens.push({ reg: r, acao: 'existente', existente: ex.id, status: ex.status, motivo: 'Já consta na planilha (linha ' + ex.linha + ', ' + nomeCor(ex.evidencia && ex.evidencia.cor) + '): ' + STATUS[ex.status].rotulo }); continue; }
        if (ex) { usadosPrevia.add(ex.id); itens.push({ reg: r, acao: 'existente', existente: ex.id, status: ex.status, motivo: 'Já importado em ' + fmtData(ex.criadoEm && ex.criadoEm.slice(0, 10)) + ' (importação repetida — não será duplicado)' }); continue; }
        if (porChave.get(r.chave) > 1) r._dupLote = normRef(r.referencia) ? 'A mesma referência (' + r.referencia + '), valor e data aparecem ' + porChave.get(r.chave) + ' vezes neste extrato' : 'Há ' + porChave.get(r.chave) + ' movimentações idênticas (mesmo valor, data e descrição, sem código) neste extrato: podem ser legítimas ou colagem repetida';
        const prov = Object.assign({ id: 'tmp' + itens.length }, r);
        const cl = classificar(prov, { hist: this.hist, regras: this.config.regras, vinculadas: vinc, outros: outros.concat(itens.filter((x) => x.acao === 'novo').map((x) => x.prov)) });
        prov.status = cl.status;
        if (cl.evidencia && cl.evidencia.chave) vinc.set(cl.evidencia.chave, prov.id);
        itens.push({ reg: r, prov, acao: 'novo', status: cl.status, motivo: cl.motivo, evidencia: cl.evidencia || null, candidatas: cl.candidatas || null, dupDe: cl.dupDe || null });
      }
      const resumo = { novos: 0, existentes: 0, invalidas: res.invalidas.length, ignoradas: res.ignoradas.length, porStatus: {}, valorNovos: 0 };
      for (const it of itens) {
        if (it.acao === 'existente') { resumo.existentes++; continue; }
        resumo.novos++; resumo.valorNovos += it.reg.valor; resumo.porStatus[it.status] = (resumo.porStatus[it.status] || 0) + 1;
      }
      return { itens, invalidas: res.invalidas, ignoradas: res.ignoradas, resumo, opts };
    }

    importar(previa, meta) {
      meta = meta || {};
      return this.transacao(async () => {
        const loteId = uid('lote');
        const novos = previa.itens.filter((i) => i.acao === 'novo');
        const ts = this.ts();
        const ids = [];
        for (const it of novos) {
          const r = it.reg;
          const c = {
            id: uid('cr'), fp: r.fp, chave: r.chave, loteId, linha: r.linha, bruto: r.bruto,
            original: { tipo: r.tipo, remetente: r.remetente, data: r.data, dataTexto: r.dataTexto, referencia: r.referencia, valor: r.valor, natureza: r.natureza, anoInferido: r.anoInferido },
            tipo: r.tipo, remetente: r.remetente, data: r.data, dataTexto: r.dataTexto, dataOperacao: r.dataOperacao, anoInferido: r.anoInferido,
            referencia: r.referencia, valor: r.valor, saldo: r.saldo, natureza: r.natureza,
            avisos: r.avisos, problemas: r.problemas,
            status: it.status, motivo: it.motivo, evidencia: it.evidencia, candidatas: it.candidatas, dupDe: it.dupDe ? (this.creditos.get(it.dupDe) ? it.dupDe : null) : null,
            lancamento: null, decisaoManual: false, exportacoes: [],
            criadoEm: ts, atualizadoEm: ts, rev: 0, uid: this.usuario.id || null,
          };
          if (it.dupDe && it.dupDe.startsWith('tmp')) { const alvo = novos.find((x) => x.prov && x.prov.id === it.dupDe); c._dupTmp = alvo; }
          it._criado = c;
        }
        for (const it of novos) { if (it._criado._dupTmp) { it._criado.dupDe = it._criado._dupTmp._criado.id; delete it._criado._dupTmp; } }
        for (const it of novos) {
          const c = it._criado;
          c.lancamento = this._lancamentoInicial(c, c.status === 'lancado' || c.status === 'utilizado' ? c.evidencia : null);
          this._salvarCredito(c); ids.push(c.id);
          this._evento({ tipo: 'importacao', creditoId: c.id, loteId, para: c.status, motivo: c.motivo, detalhe: { bruto: c.bruto, identificado: c.original, evidencia: c.evidencia ? c.evidencia.descricao : null } });
        }
        const lote = {
          id: loteId, criadoEm: ts, uid: this.usuario.id || null, por: this.usuario.rotulo || '', origem: meta.origem || 'colagem', arquivo: meta.arquivo || null,
          hash: meta.hash || null, linhasTotal: meta.linhasTotal || null, anoConfirmado: previa.opts && previa.opts.ano || null,
          novos: ids.length, existentes: previa.resumo.existentes, invalidas: previa.invalidas.slice(0, 500), ignoradas: previa.ignoradas.length,
          porStatus: previa.resumo.porStatus, valorNovos: previa.resumo.valorNovos, creditos: ids, situacao: 'concluido',
        };
        this.lotes.put(loteId, lote);
        this._evento({ tipo: 'lote', loteId, motivo: 'Importação de ' + ids.length + ' crédito(s) novo(s); ' + lote.existentes + ' já existente(s); ' + previa.invalidas.length + ' linha(s) inválida(s)', detalhe: { arquivo: lote.arquivo, origem: lote.origem, hash: lote.hash } });
        return lote;
      });
    }

    _lancamentoInicial(c, evid) {
      const cfg = this.config;
      const l = { identificacao: identificacaoPadrao(c, cfg), protocolo: '', solicitante: '', dataConferencia: '', conferente: '', comentario: '', sugestoes: {} };
      if (evid) { l.protocolo = evid.protocolo || ''; l.solicitante = evid.solicitante || ''; l.dataConferencia = evid.dataConferencia || ''; l.conferente = evid.conferente || ''; l.comentario = evid.comentario || ''; l.identificacao = evid.identificacao || l.identificacao; l.daPlanilha = true; }
      else if (cfg.regras.sugerirSolicitante) { const s = sugerirSolicitante(c, this.hist); if (s) { l.solicitante = s.valor; l.sugestoes.solicitante = s; } }
      return l;
    }

    // ---------- planilha
    importarPlanilha(lida, meta) {
      return this.transacao(async () => {
        const antes = this.planilha.tamanho;
        this.planilha.limpar();
        lida.linhas.forEach((l, k) => this.planilha.put('l' + pad(k, 6), l));
        const lim = hojeISO(this.agora()); const datas = lida.linhas.map((l) => l.d).filter((d) => d && d >= '2000-01-01' && d <= lim).sort();
        this.planilhaMeta = { arquivo: meta.arquivo || null, aba: meta.aba || null, hash: meta.hash || null, importadoEm: this.ts(), uid: this.usuario.id, por: this.usuario.rotulo, linhas: lida.linhas.length, invalidas: lida.invalidas.length, primeiraData: datas[0] || null, ultimaData: datas[datas.length - 1] || null, cabecalho: lida.cabecalho };
        this._pmSuja = true;
        const cab = lida.cabecalho;
        const p = this.config.planilha;
        p.aba = meta.aba || p.aba; p.linhaCabecalho = cab.linha; p.colunaInicial = cab.colunaInicial;
        const antigas = new Map(p.colunas.map((c) => [c.nome, c]));
        p.colunas = cab.nomes.map((nome, i) => {
          const campoMap = Object.keys(cab.mapa).find((k) => cab.mapa[k] === cab.colunaInicial - 1 + i);
          const ant = antigas.get(nome);
          const campo = ant ? ant.campo : (campoMap || '');
          return { nome, campo, obrigatorio: ant ? ant.obrigatorio : ['dataDeposito', 'identificacao', 'valor', 'solicitante', 'dataConferencia', 'conferente'].includes(campo) };
        });
        if (meta.titulo) p.titulo = meta.titulo; if (meta.codigo) p.codigo = meta.codigo;
        p.origem = (meta.arquivo || 'planilha') + (meta.aba ? ' (aba ' + meta.aba + ')' : '') + ', importada em ' + fmtData(this.hoje());
        const solic = new Map();
        for (const l of lida.linhas.slice(-3000)) if (l.s) solic.set(l.s.toUpperCase(), (solic.get(l.s.toUpperCase()) || 0) + 1);
        this.config.solicitantes = Array.from(solic.entries()).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
        if (!this.config.conferentePadrao) {
          const conf = new Map(); for (const l of lida.linhas.slice(-300)) if (l.c) conf.set(l.c.toUpperCase(), (conf.get(l.c.toUpperCase()) || 0) + 1);
          const top = Array.from(conf.entries()).sort((a, b) => b[1] - a[1])[0]; if (top) this.config.conferentePadrao = top[0];
        }
        this.config.configurado = true; this._cfgSuja = true;
        this._reindexar();
        this._evento({ tipo: 'planilha', motivo: 'Planilha importada: ' + lida.linhas.length + ' linhas (' + lida.invalidas.length + ' com problemas de leitura); substitui ' + antes + ' linhas anteriores', detalhe: { arquivo: meta.arquivo, aba: meta.aba, hash: meta.hash, cabecalho: cab.nomes } });
        const sinc = this._sincronizarPlanilha(meta);
        const rep = this._reprocessar('Reprocessado após importação da planilha');
        return { linhas: lida.linhas.length, invalidas: lida.invalidas.length, reprocessados: rep, criados: sinc.criados, atualizados: sinc.atualizados, ignorados: sinc.ignorados };
      });
    }

    /** Cria (ou atualiza) um crédito para cada linha da planilha, com a situação dada pela cor da linha. */
    _sincronizarPlanilha(meta) {
      const hist = this.hist; if (!hist) return { criados: 0, atualizados: 0, ignorados: 0 };
      const regras = this.config.regras, ts = this.ts();
      const porEvid = new Map(), porFp = new Map();
      for (const c of this.creditos.todos()) { if (c.evidencia && c.evidencia.chave) porEvid.set(c.evidencia.chave, c); porFp.set(c.fp, c); }
      const loteId = uid('lote');
      const ocorr = new Map(); let criados = 0, atualizados = 0, ignorados = 0; const porStatus = {}; let valor = 0;
      for (const l of hist.linhas) {
        if (l.v == null || l.v <= 0) { ignorados++; continue; }
        const base = { referencia: l._ref, valor: l.v, data: l.d, remetente: l._rem, tipo: '' };
        const chave = chaveCredito(base);
        const k = (ocorr.get(chave) || 0) + 1; ocorr.set(chave, k);
        const fp = chave + '#' + k;
        const ck = chaveLinhaPlanilha(l);
        const st = statusDaCor(l.f, regras);
        const ev = { fonte: 'planilha', linha: l.n, chave: ck, cor: l.f || '' };
        const lanc = { identificacao: l.i, protocolo: l.p || '', solicitante: l.s || '', dataConferencia: l.dc || '', conferente: l.c || '', comentario: l.o || '' };
        const motivo = 'Linha ' + l.n + ' ' + (l.f ? 'pintada (' + nomeCor(l.f) + ')' : 'sem cor');
        const ex = porEvid.get(ck) || porFp.get(fp);
        if (ex) {
          const c = clone(ex); let mud = false; const de = c.status;
          const sobe = st === 'utilizado' && c.status !== 'utilizado' && c.status !== 'cancelado' && c.status !== 'ignorado';
          const novoDaPlanilha = c.origem === 'planilha' && c.status !== st && !c.decisaoManual;
          const naoConferido = ['pendente', 'conferencia', 'duplicidade'].includes(c.status) && !c.decisaoManual;
          if (sobe || novoDaPlanilha || naoConferido) { c.status = st; c.motivo = motivo; mud = true; }
          if (!c.evidencia || c.evidencia.chave !== ck || c.evidencia.cor !== ev.cor) { c.evidencia = Object.assign({}, c.origem === 'planilha' ? {} : c.evidencia, ev, c.origem === 'planilha' ? {} : { descricao: 'Planilha FIN - 00, linha ' + l.n + ' (' + nomeCor(l.f) + ')' }); mud = true; }
          if (c.origem === 'planilha' || naoConferido) { const a = JSON.stringify(c.lancamento || {}); c.lancamento = Object.assign({}, c.lancamento || {}, lanc); if (JSON.stringify(c.lancamento) !== a) mud = true; }
          if (mud) {
            this._salvarCredito(c); atualizados++;
            if (de !== c.status) this._evento({ tipo: 'status', creditoId: c.id, de, para: c.status, motivo: 'Atualizado pela planilha: ' + motivo, automatico: true });
          }
          continue;
        }
        // registro compacto: os campos vazios/padrão são omitidos para caber no banco
        const c = { id: 'pl' + l.n, fp, chave, origem: 'planilha', loteId, linha: l.n, remetente: l._rem || l.i, data: l.d, referencia: l._ref, valor: l.v, status: st, motivo, evidencia: ev, lancamento: lanc, criadoEm: ts, rev: 0 };
        for (const kk of Object.keys(lanc)) if (!lanc[kk]) delete lanc[kk];
        if (l.x) c.avisos = ['Planilha: ' + l.x];
        if (c.referencia == null) delete c.referencia;
        if (this.creditos.get(c.id)) c.id = uid('pl');
        this.creditos.put(c.id, c); criados++; porStatus[st] = (porStatus[st] || 0) + 1; valor += l.v;
      }
      if (criados) {
        this.lotes.put(loteId, { id: loteId, criadoEm: ts, uid: this.usuario.id || null, por: this.usuario.rotulo || '', origem: 'planilha', arquivo: (meta && meta.arquivo) || null, hash: (meta && meta.hash) || null, novos: criados, existentes: atualizados, invalidas: [], ignoradas: ignorados, porStatus, valorNovos: valor, situacao: 'concluido' });
        this._evento({ tipo: 'lote', loteId, motivo: 'Carga da planilha: ' + criados + ' crédito(s) criados a partir das linhas (situação pela cor: pintada = utilizado, sem cor = aguardando utilização); ' + atualizados + ' atualizado(s); ' + ignorados + ' linha(s) sem valor', detalhe: { porStatus } });
      }
      return { criados, atualizados, ignorados };
    }

    _reprocessar(motivoBase) {
      const alterados = [];
      const vinc = this._vinculadas();
      const outros = this.creditos.todos().filter((c) => c.status !== 'cancelado');
      const alvo = this.creditos.todos().filter((c) => !c.decisaoManual && ['pendente', 'conferencia', 'duplicidade'].includes(c.status) && !c.lancamento?.confirmadoEm).sort((a, b) => (a.criadoEm < b.criadoEm ? -1 : 1));
      for (const c0 of alvo) {
        const c = clone(c0);
        const cl = classificar(c, { hist: this.hist, regras: this.config.regras, vinculadas: vinc, outros });
        if (cl.status === c.status && cl.motivo === c.motivo) continue;
        const de = c.status;
        c.status = cl.status; c.motivo = cl.motivo; c.evidencia = cl.evidencia || null; c.candidatas = cl.candidatas || null; if (cl.dupDe) c.dupDe = cl.dupDe;
        if (cl.evidencia) { vinc.set(cl.evidencia.chave, c.id); if (cl.status === 'lancado' || cl.status === 'utilizado') c.lancamento = this._lancamentoInicial(c, cl.evidencia); }
        this._salvarCredito(c);
        this._evento({ tipo: 'status', creditoId: c.id, de, para: c.status, motivo: motivoBase + ': ' + c.motivo, automatico: true, detalhe: cl.evidencia ? { evidencia: cl.evidencia.descricao } : null });
        alterados.push(c.id);
      }
      return alterados.length;
    }
    reprocessar() { return this.transacao(async () => this._reprocessar('Reclassificação solicitada')); }

    // ---------- edição e status
    editar(id, patch, motivo) {
      return this.transacao(async () => {
        const c = clone(this.creditos.get(id)); if (!c) throw new Error('Crédito não encontrado');
        const camposOk = ['tipo', 'remetente', 'data', 'referencia', 'valor'];
        const lancOk = ['identificacao', 'protocolo', 'solicitante', 'dataConferencia', 'conferente', 'comentario'];
        const dif = {};
        for (const [k, v] of Object.entries(patch)) {
          if (camposOk.includes(k)) {
            const nv = k === 'valor' ? v : (v == null ? null : String(v).trim());
            if (k === 'valor' && (!Number.isInteger(nv) || nv <= 0)) throw new Error('Valor inválido: informe um valor maior que zero');
            if (k === 'data' && nv && !/^\d{4}-\d{2}-\d{2}$/.test(nv)) throw new Error('Data inválida');
            if (c[k] !== nv) { dif[k] = [c[k], nv]; c[k] = nv; if (k === 'data') c.anoInferido = false; }
          } else if (k.startsWith('lancamento.') && lancOk.includes(k.slice(11))) {
            const f = k.slice(11); c.lancamento = c.lancamento || {};
            const nv = v == null ? '' : String(v).trim();
            if ((c.lancamento[f] || '') !== nv) { dif[k] = [c.lancamento[f] || '', nv]; c.lancamento[f] = nv; if (f === 'solicitante' && c.lancamento.sugestoes) delete c.lancamento.sugestoes.solicitante; }
          } else if (k === 'confirmarAno' && v && c.anoInferido) { dif.anoInferido = [true, false]; c.anoInferido = false; }
        }
        if (!Object.keys(dif).length) return c;
        if (dif.referencia || dif.valor || dif.data || dif.remetente) { c.chave = chaveCredito(c); }
        this._salvarCredito(c);
        this._evento({ tipo: 'edicao', creditoId: id, campos: dif, motivo: motivo || 'Edição manual' });
        return c;
      });
    }

    alterarStatus(ids, status, motivo, extra) {
      extra = extra || {};
      if (!STATUS[status]) return Promise.reject(new Error('Status inválido'));
      if (!motivo || !String(motivo).trim()) return Promise.reject(new Error('Informe o motivo da alteração'));
      if (status === 'utilizado' && !extra.protocolo && !extra.protocoloPorId && !extra.evidenciaManual) return Promise.reject(new Error('Para marcar como utilizado, informe o n.º do protocolo ou a referência correspondente'));
      return this.transacao(async () => {
        const out = [];
        for (const id of ids) {
          const c = clone(this.creditos.get(id)); if (!c) throw new Error('Crédito ' + id + ' não encontrado');
          const de = c.status;
          c.status = status; c.decisaoManual = true; c.motivo = (STATUS[status].rotulo) + ' manualmente: ' + motivo;
          c.lancamento = c.lancamento || this._lancamentoInicial(c, null);
          if (status === 'utilizado') {
            const prot = (extra.protocoloPorId && extra.protocoloPorId[id]) || extra.protocolo;
            if (!prot && !extra.evidenciaManual) throw new Error('Falta o n.º do protocolo para ' + (c.remetente || 'o crédito') + ' (' + formatBRL(c.valor) + ')');
            extra = Object.assign({}, extra, { protocolo: prot });
            if (extra.protocolo) c.lancamento.protocolo = String(extra.protocolo).trim();
            c.evidencia = c.evidencia && c.evidencia.fonte === 'planilha' ? c.evidencia : { fonte: 'manual', descricao: 'Marcado como utilizado por ' + (this.usuario.rotulo || 'usuário') + ' em ' + fmtData(this.hoje()) + (extra.protocolo ? ' com protocolo ' + extra.protocolo : '') + ': ' + motivo, protocolo: extra.protocolo || null };
          }
          if (extra.vincularCandidata != null && c.candidatas && c.candidatas[extra.vincularCandidata]) { c.evidencia = c.candidatas[extra.vincularCandidata]; c.lancamento = this._lancamentoInicial(c, c.evidencia); }
          if (status === 'utilizado') { c.lancamento.utilizadoPor = this.usuario.rotulo || ''; c.lancamento.utilizadoEm = this.ts(); }
          else { delete c.lancamento.utilizadoPor; delete c.lancamento.utilizadoEm; }
          if (status === 'cancelado' || status === 'ignorado') c.arquivadoEm = this.ts();
          else delete c.arquivadoEm;
          this._salvarCredito(c);
          this._evento({ tipo: 'status', creditoId: id, de, para: status, motivo, detalhe: Object.keys(extra).length ? extra : null });
          out.push(c);
        }
        return out;
      });
    }

    faltandoParaLancar(c) {
      const falt = [];
      for (const col of this.config.planilha.colunas) {
        if (!col.obrigatorio || !col.campo) continue;
        const v = col.campo === 'dataConferencia' || col.campo === 'conferente' && (this.config.conferentePadrao || this.usuario.rotulo) ? 'auto' : valorCampo(c, col.campo, this.config, { hoje: this.hoje() });
        if (v === '' || v == null) falt.push(col.nome);
      }
      return falt;
    }

    confirmarLancamento(ids, dados) {
      dados = dados || {};
      return this.transacao(async () => {
        const out = [];
        for (const id of ids) {
          const c = clone(this.creditos.get(id)); if (!c) throw new Error('Crédito não encontrado');
          if (!['pendente', 'conferencia', 'duplicidade'].includes(c.status)) throw new Error('O crédito de ' + formatBRL(c.valor) + ' (' + c.remetente + ') está como "' + STATUS[c.status].rotulo + '" e não pode ser lançado de novo');
          const d = Object.assign({}, dados.comum || {}, (dados.porId || {})[id] || {});
          c.lancamento = Object.assign(c.lancamento || {}, d);
          if (!c.lancamento.dataConferencia) c.lancamento.dataConferencia = this.hoje();
          if (!c.lancamento.conferente) c.lancamento.conferente = this.usuario.rotulo || this.config.conferentePadrao || '';
          const falt = this.faltandoParaLancar(c);
          if (falt.length) throw new Error('Faltam campos obrigatórios para ' + (c.remetente || 'crédito') + ' (' + formatBRL(c.valor) + '): ' + falt.join(', '));
          const de = c.status;
          c.status = 'lancado';
          c.lancamento.confirmadoEm = this.ts(); c.lancamento.confirmadoPor = this.usuario.rotulo || ''; c.decisaoManual = true;
          c.motivo = 'Conferido e lançado no aplicativo; aguardando utilização' + (c.lancamento.protocolo ? ' (protocolo ' + c.lancamento.protocolo + ')' : '');
          c.evidencia = c.evidencia && c.evidencia.fonte === 'planilha' ? c.evidencia : { fonte: 'app', descricao: 'Lançamento confirmado no aplicativo em ' + fmtData(this.hoje()) + ' por ' + (this.usuario.rotulo || 'usuário') + (c.lancamento.protocolo ? ', protocolo ' + c.lancamento.protocolo : ''), protocolo: c.lancamento.protocolo || null };
          this._salvarCredito(c);
          this._evento({ tipo: 'lancamento', creditoId: id, de, para: c.status, motivo: c.motivo, detalhe: { lancamento: Object.assign({}, c.lancamento, { sugestoes: undefined }) } });
          out.push(c);
        }
        return out;
      });
    }

    registrarExportacao(ids, arquivo, formato, escopo) {
      return this.transacao(async () => {
        const ts = this.ts();

    const delim = [';', '\t', ','].sort((a, b) => cont(b) - cont(a))[0];
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < txt.length; i++) {

      if (ch === '"') q = true;

  // ---------- pesquisa rápida de crédito (protocolo, código, nome, valor)
  function pesquisar(tipo, q) {
    q = String(q || '').trim(); if (!q) return [];
    const dig = q.replace(/\D/g, '');
    const nq = U.norm(q);
    const cents = U.parseMoneyBR(/[,.]\d{1,2}$/.test(q) ? (/,\d$/.test(q) ? q + '0' : q) : q + ',00');
    const protOk = (c) => {
      if (!dig) return false;
      const p = String((c.lancamento && c.lancamento.protocolo) || '').replace(/(\d)\.(\d)/g, '$1$2');
      return p.split(/\D+/).some((x) => x && x === dig);
    };
    const idOk = (c) => dig && String(c.referencia || '').replace(/^0+/, '').includes(dig.replace(/^0+/, ''));
    const nomeOk = (c) => nq && (U.norm(c.remetente).includes(nq) || U.norm(c.lancamento && c.lancamento.identificacao).includes(nq) || U.norm(c.lancamento && c.lancamento.solicitante) === nq);
    const valorOk = (c) => cents != null && c.valor === Math.abs(cents);
    const f = { protocolo: protOk, id: idOk, nome: nomeOk, valor: valorOk }[tipo] || ((c) => protOk(c) || idOk(c) || nomeOk(c) || valorOk(c));
    return repo.creditos.todos().filter(f).sort((a, b) => ((a.data || '') < (b.data || '') ? 1 : -1));
  }
  function alertaSituacao(c) {
    const l = c.lancamento || {};
    const conf = l.conferente ? ' por <b>' + esc(l.conferente) + '</b>' + (l.dataConferencia ? ' em ' + esc(dt(l.dataConferencia)) : '') : '';
    if (c.status === 'utilizado') return '<div class="alerta err" style="margin:0"><span><b>ATENÇÃO: crédito JÁ UTILIZADO</b>' + (l.protocolo ? ' no protocolo <b class="num">' + esc(l.protocolo) + '</b>' : '') + (l.utilizadoPor ? ' — marcado por ' + esc(l.utilizadoPor) + ' em ' + dtHora(l.utilizadoEm) : c.evidencia && c.evidencia.fonte === 'planilha' && c.evidencia.cor ? ' — linha pintada na planilha' : '') + '.' + (conf ? ' Conferido' + conf + '.' : '') + '</span></div>';
    if (c.status === 'lancado') return '<div class="alerta" style="margin:0"><span><b>ATENÇÃO: crédito JÁ CONFERIDO</b>' + conf + (l.solicitante ? ' para ' + esc(l.solicitante) : '') + ' — ainda não utilizado.</span></div>';
    if (c.status === 'pendente') return '<div class="alerta ok" style="margin:0"><span>Crédito ainda <b>não conferido</b>: livre para conferência.</span></div>';
    if (c.status === 'ignorado' || c.status === 'cancelado') return '<div class="alerta err" style="margin:0"><span><b>Crédito ' + esc(S[c.status].rotulo.toLowerCase()) + '</b>: ' + esc(c.motivo) + '</span></div>';
    return '<div class="alerta" style="margin:0"><span><b>' + esc(S[c.status].rotulo) + '</b>: ' + esc(c.motivo) + '</span></div>';
  }
  VIEWS.painel = () => {
    const lanc = repo.creditos.todos().filter((c) => c.status === 'lancado');
    const tot = lanc.reduce((a, c) => a + c.valor, 0);
    const b = ui.busca || (ui.busca = { tipo: 'todos', q: '' });
    let h = cabecalho('Painel', '', '<a class="btn pri" href="#importar">Importar movimentações</a>', 'FIN - 00');
    h += avisosGerais();
    h += '<div class="kpis" style="grid-template-columns:minmax(0,420px)"><a class="kpi destaque" href="#aguardando"><div class="lab">Conferidos, aguardando utilização</div><div class="val">' + brl(tot) + '</div><div class="sub">' + lanc.length + ' crédito(s)</div></a></div>';
    const opt = (v, r) => '<option value="' + v + '"' + (b.tipo === v ? ' selected' : '') + '>' + r + '</option>';
    h += '<div class="panel"><header><h2>Pesquisar crédito</h2><span class="hint">Antes de usar um depósito, confira se ele já foi conferido ou utilizado</span></header><form class="body row" id="fm-busca" style="align-items:end">' +

      '<label class="f" style="flex:1;min-width:200px">Digite o que procura<input type="search" id="bs-q" value="' + esc(b.q) + '" placeholder="Ex.: 722472, 279094, GIRO, 957,34" autocomplete="off"></label>' +
      '<button class="btn pri" type="submit">Pesquisar</button>' + (b.q ? '<button class="btn" type="button" data-act="busca-limpar">Limpar</button>' : '') + '</form>';
    if (b.q) {
      const res = pesquisar(b.tipo, b.q);
      if (!res.length) h += '<div class="body"><div class="alerta" style="margin:0"><span><b>Nenhum crédito encontrado</b> para "' + esc(b.q) + '". Se o depósito é recente, importe o extrato do dia antes de concluir.</span></div></div>';
      else {
        h += '<div class="body stack"><div class="small muted">' + res.length + ' crédito(s) encontrado(s)' + (res.length > 30 ? '; mostrando os 30 mais recentes' : '') + '</div>';
        h += res.slice(0, 30).map((c) => { const l = c.lancamento || {};
          return '<div style="border:1px solid var(--line);border-radius:6px;padding:10px 12px" class="stack"><div class="row" style="justify-content:space-between"><div class="row"><span class="num">' + esc(dt(c.data) || 'sem data') + '</span><b>' + esc(c.remetente || l.identificacao || '—') + '</b><span class="num muted">' + esc(c.referencia || '') + '</span><b class="num">' + brl(c.valor) + '</b>' + pill(c.status) + '</div><div class="row">' +
            (c.status === 'lancado' ? '<button class="btn sm" data-act="editar" data-id="' + c.id + '">Incluir protocolo</button><button class="btn sm pri" data-act="utilizado" data-id="' + c.id + '">Marcar como utilizado</button>' : '') + (c.status === 'pendente' ? '<button class="btn sm pri" data-act="lancar" data-id="' + c.id + '">Conferir</button>' : '') +
            '<button class="btn sm" data-act="detalhe" data-id="' + c.id + '">Detalhes</button></div></div>' + alertaSituacao(c) +
            '<div class="small muted">' + [l.protocolo ? 'Protocolo: ' + esc(l.protocolo) : '', l.solicitante ? 'Solicitante: ' + esc(l.solicitante) : '', l.conferente ? 'Conferente: ' + esc(l.conferente) : ''].filter(Boolean).join(' · ') + '</div></div>'; }).join('') + '</div>';
      }
    }
    h += '</div>';
    return h;
  };

  VIEWS.importar = () => {
    let h = cabecalho('Importar movimentações', 'Cole várias linhas copiadas do extrato ou envie um arquivo (CSV, Excel, OFX ou TXT). Nada é gravado antes da sua confirmação, e importar o mesmo extrato de novo não duplica créditos.', '', 'Extrato bancário');
    const anoPadrao = ui.impAno || +repo.hoje().slice(0, 4);
    h += '<div class="panel"><div class="body stack"><label class="f">Linhas do extrato<textarea id="imp-txt" rows="9" spellcheck="false" placeholder="PIX RECEBIDO REM: GIRO PAGAMENTOS E TEC 27/10 722472 957,34">' + esc(ui.impTxt) + '</textarea></label>' +
      '<div class="drop" id="imp-drop">Arraste um arquivo aqui ou <label style="color:var(--focus);cursor:pointer;text-decoration:underline">escolha um arquivo<input id="imp-arq" type="file" accept=".csv,.txt,.xlsx,.xls,.ofx,.ods" hidden data-act-change="arquivo-extrato"></label> · CSV, Excel, OFX ou TXT' + (ui.previaMeta && ui.previaMeta.arquivo ? '<div class="small" style="margin-top:6px">Arquivo carregado: <b>' + esc(ui.previaMeta.arquivo) + '</b></div>' : '') + '</div>' +
      '<div class="row" style="justify-content:space-between"><div class="row"><label class="f" style="width:150px">Ano para datas sem ano<input id="imp-ano" type="number" min="2000" max="2100" value="' + anoPadrao + '"></label><label class="row small" style="margin-top:16px"><input id="imp-anoconf" type="checkbox"' + (ui.impAnoConf ? ' checked' : '') + '> Confirmo este ano para as datas "dd/mm"</label></div>' +

    const p = ui.previa;

      const r = p.resumo;
      h += '<div class="panel" style="margin-top:14px"><header><h2>Resultado da análise</h2><div class="row small"><span><b>' + r.novos + '</b> novo(s) · <span class="num">' + brl(r.valorNovos) + '</span></span><span>· <b>' + r.existentes + '</b> já importado(s)</span><span>· <b>' + r.invalidas + '</b> inválida(s)</span><span>· ' + r.ignoradas + ' ignorada(s)</span></div></header>';
      h += '<div class="body row">' + Object.entries(r.porStatus).map(([k, n]) => pill(k) + ' <span class="num">' + n + '</span>').join(' &nbsp; ') + '</div>';
      const itens = p.itens.map((it, i) => Object.assign({ id: 'p' + i, _it: it }, it.reg, { status: it.acao === 'existente' ? 'existente' : it.status, motivo: it.motivo }));
      const colRes = { id: 'res', rot: 'Classificação', val: (c) => c.status, html: (c) => (c.status === 'existente' ? '<span class="pill st-existente">Já consta</span> ' + pill(c._it.status) : pill(c.status)) };
      const colMot = { id: 'mot', rot: 'Motivo', html: (c) => '<div class="motivo">' + esc(c.motivo) + '</div>' + (c.avisos && c.avisos.length ? '<div class="small" style="margin-top:3px">' + c.avisos.map((a) => '<span class="tag">' + esc(a) + '</span>').join(' ') + '</div>' : '') };
      const colLin = { id: 'lin', rot: 'Linha', val: (c) => c.linha, html: (c) => '<span class="num muted">' + c.linha + '</span>' };
      h += tabela('previa', itens, [colLin, COL.data, COL.rem, COL.ref, COL.valor, colRes, colMot], { sort: { col: 'lin', dir: 1 }, tam: 200 });
      if (p.invalidas.length) h += '<div class="body"><h2 style="font-size:14px;margin:0 0 8px">Linhas inválidas ou incompletas (não serão importadas)</h2><div class="tw"><table class="t"><thead><tr><th>Linha</th><th>Conteúdo</th><th>Problema</th></tr></thead><tbody>' + p.invalidas.map((x) => '<tr><td class="num">' + x.linha + '</td><td class="mono">' + esc(x.bruto) + '</td><td><span class="tag err">' + esc(x.motivo) + '</span></td></tr>').join('') + '</tbody></table></div><p class="hint">Corrija essas linhas no texto acima e analise de novo, ou lance-as manualmente depois.</p></div>';
      if (p.ignoradas.length) h += '<details class="body"><summary class="small">' + p.ignoradas.length + ' linha(s) ignorada(s): débitos, saldos e cabeçalhos</summary><div class="tw" style="margin-top:8px"><table class="t"><tbody>' + p.ignoradas.slice(0, 300).map((x) => '<tr><td class="num">' + x.linha + '</td><td class="mono">' + esc(x.bruto) + '</td><td class="small muted">' + esc(x.motivo) + '</td></tr>').join('') + '</tbody></table></div></details>';
      h += '<div class="pag" style="border-top:1px solid var(--line-2)"><span>' + (r.novos ? 'Os créditos novos serão gravados com a classificação acima. Você poderá revisar cada um depois.' : 'Não há créditos novos para importar.') + '</span><button class="btn pri" data-act="imp-confirmar"' + (r.novos ? '' : ' disabled') + '>Importar ' + r.novos + ' crédito(s)</button></div></div>';
    } else {
      h += '<div class="panel" style="margin-top:14px"><header><h2>Formatos aceitos</h2></header><div class="body doc small"><ul style="margin:0;padding-left:18px">' +
        '<li>Linha única do extrato: <code>PIX RECEBIDO REM: GIRO PAGAMENTOS E TEC 27/10 722472 957,34</code></li>' +
        '<li>Cópia da tabela do internet banking (Data, Lançamento, Dcto., Crédito, Débito, Saldo), inclusive com a linha "REM: …" abaixo do lançamento</li>' +
        '<li>Arquivos CSV (separador ; , ou tabulação), Excel (.xlsx/.xls), OFX e TXT</li>' +
        '<li>Espaços extras, tabulações e "R$" são tolerados; datas sem ano recebem o ano informado acima</li></ul></div></div>';
    }
    return h;
  };

  function colsPendentes() {
    const ed = (campo, ph) => (c) => '<input type="text" id="ed-' + campo + '-' + c.id + '" data-ed="' + campo + '" data-id="' + c.id + '" value="' + esc((c.lancamento && c.lancamento[campo]) || '') + '" placeholder="' + esc(ph) + '"' + (campo === 'solicitante' ? ' list="dl-solic"' : '') + '>' + (campo === 'solicitante' && c.lancamento && c.lancamento.sugestoes && c.lancamento.sugestoes.solicitante ? '<div class="small muted" title="' + esc(c.lancamento.sugestoes.solicitante.base) + '">sugerido pelo histórico</div>' : '');
    return [COL.data, COL.rem, COL.ref, COL.valor,
      { id: 'ident', rot: 'Identificação na planilha', html: (c) => '<span class="small">' + esc(C.valorCampo(c, 'identificacao', repo.config)) + '</span>' },
      { id: 'solic', rot: 'Solicitante', html: ed('solicitante', 'Colaborador') },
      { id: 'prot', rot: 'Protocolo', html: ed('protocolo', 'Opcional') },
      { id: 'coment', rot: 'Comentário', html: ed('comentario', '') },
      { id: 'falta', rot: 'Falta', html: (c) => { const f = repo.faltandoParaLancar(c); return f.length ? '<span class="tag err">' + esc(f.join(', ')) + '</span>' : '<span class="tag" style="background:var(--util-bg);color:var(--util-fg)">pronto</span>'; } },
      { id: 'ac', rot: '', html: (c) => '<div class="acoes"><button class="btn sm pri" data-act="lancar" data-id="' + c.id + '">Confirmar</button><button class="btn sm" data-act="utilizado" data-id="' + c.id + '">Utilizado</button><button class="btn sm" data-act="ignorar" data-id="' + c.id + '">Ignorar</button><button class="btn sm" data-act="detalhe" data-id="' + c.id + '">Detalhes</button></div>' }];
  }
  function barraLote(acoes) {
    if (!ui.sel.size) return '';
    return '<div class="bulk"><b>' + ui.sel.size + ' selecionado(s)</b>' + acoes + '<button class="btn sm" data-act="sel-limpar">Limpar seleção</button></div>';
  }
  const datalistSolic = () => '<datalist id="dl-solic">' + (repo.config.solicitantes || []).map((s) => '<option value="' + esc(s) + '">').join('') + '</datalist>';

  VIEWS.pendentes = () => {

    const vis = new Set(lista.map((c) => c.id)); for (const id of Array.from(ui.sel)) if (!vis.has(id)) ui.sel.delete(id);

      '<button class="btn" data-act="exp-pend" data-fmt="csv">Exportar pendentes (CSV)</button><button class="btn gold" data-act="exp-pend" data-fmt="xlsx">Exportar pendentes (Excel)</button>', S.pendente.rotulo);

    h += '<div class="panel">' + barraFiltros('pendentes') + barraLote('<span class="row"><input type="text" id="lote-solic" list="dl-solic" placeholder="Solicitante" style="width:150px"><button class="btn sm" data-act="lote-solic">Aplicar aos selecionados</button></span><button class="btn sm pri" data-act="lancar-lote">Confirmar lançamento</button><button class="btn sm" data-act="ignorar-lote">Ignorar</button><button class="btn sm" data-act="exp-sel" data-fmt="xlsx">Exportar Excel</button><button class="btn sm" data-act="exp-sel" data-fmt="csv">CSV</button>') +
      tabela('pendentes', lista, colsPendentes(), { sel: true, sort: { col: 'data', dir: 1 }, vazio: '<b>Nenhum crédito pendente</b>Importe movimentações ou revise as conferências.' }) + '</div>';

  const novosParaPlanilha = () => repo.creditos.todos().filter((c) => (c.status === 'lancado' || c.status === 'utilizado') && c.evidencia && c.evidencia.fonte !== 'planilha' && !(c.exportacoes && c.exportacoes.length));
  const pintarNaPlanilha = (c) => c.status === 'utilizado' && (!c.evidencia || c.evidencia.fonte !== 'planilha' || !c.evidencia.cor);
  VIEWS.aguardando = () => {
    const lista = filtrar(repo.creditos.todos().filter((c) => c.status === 'lancado'), ui.filtros.aguardando);
    const vis = new Set(lista.map((c) => c.id)); for (const id of Array.from(ui.sel)) if (!vis.has(id)) ui.sel.delete(id);

      '<button class="btn" data-act="exp-novos" data-fmt="csv">Novas linhas (CSV)</button><button class="btn gold" data-act="exp-novos" data-fmt="xlsx">Novas linhas para a planilha (' + naoExp + ')</button>', 'Grupo A');

    h += '<div class="panel" style="margin-top:14px"><header><h2>Restaurar backup</h2></header><div class="body stack"><label class="btn" style="align-self:flex-start">Escolher arquivo de backup (.json)<input type="file" id="rs-arq" accept=".json,application/json" hidden data-act-change="arquivo-backup"></label>';

      '<p>Limites do banco: até 25 mil documentos por aplicativo e 256 KiB por documento. Os registros são agrupados em blocos de cerca de 200 KB (a planilha de 20 mil linhas ocupa cerca de 15 documentos), o que comporta muitos anos de uso. Se um limite for atingido, nada é gravado e o aplicativo avisa.</p>' +
      '<h3>Formato do backup</h3><p>Arquivo JSON com <code>formato: "' + C.BACKUP_FORMATO + '"</code>, <code>versao: ' + C.BACKUP_VERSAO + '</code>, <code>contagens</code>, <code>integridade</code> (SHA-256 sobre o campo <code>dados</code> com as chaves em ordem alfabética) e <code>dados</code>:</p><ul>' +

      '<li><code>eventos[]</code>: histórico completo (<code>id</code>, <code>ts</code>, <code>tipo</code>, <code>creditoId</code>, <code>de</code>, <code>para</code>, <code>campos</code>, <code>motivo</code>, <code>por</code>).</li>' +
