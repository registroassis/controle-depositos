  function coresNaPlanilha() {
    const m = new Map(); for (const l of repo.planilha.todos()) m.set(l.f || '', (m.get(l.f || '') || 0) + 1);
    return Array.from(m.entries()).sort((a, b) => b[1] - a[1]);
  }
  function coresConfig(r) {
    const cores = coresNaPlanilha(); if (!cores.length) return '<p class="hint" style="margin:0">Importe a planilha para configurar o significado das cores das linhas.</p>';
    const opt = (cor, v) => '<option value="' + v + '"' + (C.statusDaCor(cor, r) === v ? ' selected' : '') + '>' + esc(S[v].rotulo) + '</option>';
    return '<div><div class="small muted" style="margin-bottom:4px">Cor da linha na planilha → situação do crédito</div><table class="t"><tbody>' + cores.map(([cor, n]) => '<tr><td><span style="display:inline-block;width:14px;height:14px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px;background:' + (cor ? '#' + esc(cor) : 'transparent') + '"></span>' + esc(C.nomeCor(cor)) + ' <span class="num muted">(' + n + ')</span></td><td><select data-cor="' + esc(cor) + '" id="cf-cor-' + esc(cor || 'nenhuma') + '">' + opt(cor, 'utilizado') + opt(cor, 'lancado') + opt(cor, 'conferencia') + '</select></td></tr>').join('') + '</tbody></table><p class="hint" style="margin:4px 0 0">Ao salvar, reimporte a planilha para aplicar a mudança aos créditos já carregados.</p></div>';
  }
  function lerCoresConfig() { const o = {}; document.querySelectorAll('[data-cor]').forEach((s2) => { o[s2.dataset.cor] = s2.value; }); return o; }

  let usuariosCache = null;
  async function carregarUsuarios() { const sn = await fbDb.collection('usuarios').get(); usuariosCache = sn.docs.map((d) => Object.assign({ uid: d.id }, d.data())).sort((a, b) => (a.nome < b.nome ? -1 : 1)); render(); }
  VIEWS.usuarios = () => {
    if (modo !== 'firebase' || !perfilFb || perfilFb.papel !== 'admin') return cabecalho('Usuários e acessos', 'Disponível apenas para a administradora no site do Controle de Depósitos.');

    let h = cabecalho('Usuários e acessos', 'Cadastre quem confere os créditos. Cada pessoa entra com e-mail e senha; o nome cadastrado aparece como CONFERENTE nos créditos que ela conferir.', '<button class="btn pri" data-act="novo-usuario">Cadastrar conferente</button>');

      { id: 'email', rot: 'E-mail', val: (u) => u.email, html: (u) => esc(u.email) },
      { id: 'papel', rot: 'Perfil', val: (u) => u.papel, html: (u) => esc(u.papel === 'admin' ? 'Administradora' : 'Conferente') },
      { id: 'ativo', rot: 'Acesso', val: (u) => (u.ativo ? 1 : 0), html: (u) => (u.ativo ? '<span class="pill st-utilizado">Ativo</span>' : '<span class="pill st-cancelado">Desativado</span>') },
      { id: 'ac', rot: '', html: (u) => '<div class="acoes"><button class="btn sm" data-act="editar-usuario" data-uid="' + esc(u.uid) + '">Editar</button><button class="btn sm" data-act="reset-senha" data-uid="' + esc(u.uid) + '">Enviar nova senha</button>' + (u.uid !== perfilFb.uid ? '<button class="btn sm' + (u.ativo ? ' danger' : '') + '" data-act="ativar-usuario" data-uid="' + esc(u.uid) + '">' + (u.ativo ? 'Desativar' : 'Reativar') + '</button>' : '') + '</div>' },
    ];
    h += '<div class="panel">' + tabela('usuarios', usuariosCache.map((u) => Object.assign({ id: u.uid }, u)), cols, { sort: { col: 'nome', dir: 1 }, semTotal: true }) + '</div>';
    h += '<p class="hint">Desativar bloqueia o acesso na hora, sem apagar o que a pessoa já conferiu. Não há exclusão de usuários para preservar o histórico.</p>';
    return h;
  };

  // ------------------------------------------------------------ detalhes e ações de crédito
  function detalhe(id) {
    const c = repo.creditos.get(id); if (!c) return;
    const l = c.lancamento || {}, o = c.original || {};
    const lt = repo.lotes.get(c.loteId);
    const evs = repo.eventosDe(id);
    const dif = (k, fmt) => (o[k] !== undefined && o[k] !== c[k] ? ' <span class="small muted">(original: ' + esc(fmt ? fmt(o[k]) : o[k] || '—') + ')</span>' : '');
    const corpo = '<div class="row">' + pill(c.status) + '<span class="muted small">' + esc(c.motivo) + '</span></div>' +
      '<div class="grid2"><div class="stack"><dl class="kv"><dt>Data</dt><dd class="num">' + (c.data ? dt(c.data) : '—') + (c.anoInferido ? ' <span class="tag">ano inferido</span>' : '') + dif('data', dt) + '</dd><dt>Tipo</dt><dd>' + esc(c.tipo || '—') + dif('tipo') + '</dd><dt>Remetente</dt><dd>' + esc(c.remetente || '—') + dif('remetente') + '</dd><dt>Código</dt><dd class="num">' + esc(c.referencia || '—') + dif('referencia') + '</dd><dt>Valor</dt><dd class="num">' + brl(c.valor) + dif('valor', brl) + '</dd>' +
      '<dt>Identificação</dt><dd>' + esc(C.valorCampo(c, 'identificacao', repo.config)) + '</dd><dt>Protocolo</dt><dd class="num">' + esc(l.protocolo || '—') + '</dd><dt>Solicitante</dt><dd>' + esc(l.solicitante || '—') + '</dd><dt>Data conferência</dt><dd class="num">' + esc(dt(l.dataConferencia) || '—') + '</dd><dt>Conferente</dt><dd>' + esc(l.conferente || '—') + '</dd>' + (l.utilizadoPor ? '<dt>Utilizado por</dt><dd>' + esc(l.utilizadoPor) + ' em ' + dtHora(l.utilizadoEm) + '</dd>' : '') + '<dt>Comentário</dt><dd>' + esc(l.comentario || '—') + '</dd></dl>' +
      '<div><div class="small muted">Evidência</div><div class="small">' + esc(C.descEvidencia(c) || 'Nenhuma evidência de utilização registrada.') + '</div></div>' +
      ((c.avisos || []).length || (c.problemas || []).length ? '<div class="row">' + (c.avisos || []).map((a) => '<span class="tag">' + esc(a) + '</span>').join('') + (c.problemas || []).map((a) => '<span class="tag err">' + esc(a) + '</span>').join('') + '</div>' : '') +
      (c.origem === 'planilha' ? '<div><div class="small muted">Origem</div><div class="small">Carregado da planilha FIN - 00, linha ' + esc(c.linha) + '</div></div>' : '<div><div class="small muted">Texto original do extrato (linha ' + esc(c.linha) + ')</div><pre class="raw">' + esc(c.bruto) + '</pre></div>') +
      '<dl class="kv small"><dt>Lote</dt><dd>' + (lt ? dtHora(lt.criadoEm) + ' · ' + esc(lt.arquivo || (lt.origem === 'colagem' ? 'texto colado' : lt.origem)) : '<span class="tag err">lote não encontrado</span>') + '</dd><dt>Exportações</dt><dd>' + ((c.exportacoes || []).map((x) => dtHora(x.em) + ' · ' + esc(x.arquivo)).join('<br>') || 'nenhuma') + '</dd><dt>ID</dt><dd class="num">' + esc(c.id) + '</dd></dl></div>' +
      '<div><div class="small muted" style="margin-bottom:8px">Linha do tempo</div><ul class="tl">' + evs.map((e) => '<li><time>' + dtHora(e.ts) + '</time> · <b>' + esc(C.ROTULO_EVENTO[e.tipo] || e.tipo) + '</b>' + (e.por ? ' · ' + esc(e.por) : '') + (e.de || e.para ? '<div>' + (e.de ? pill(e.de) + ' → ' : '') + (e.para ? pill(e.para) : '') + '</div>' : '') + (e.campos ? Object.entries(e.campos).map(([k, [a, b]]) => '<div>' + esc(k.replace('lancamento.', '')) + ': <s class="muted">' + esc(a == null || a === '' ? '(vazio)' : a) + '</s> → ' + esc(b == null || b === '' ? '(vazio)' : b) + '</div>').join('') : '') + '<div class="muted">' + esc(e.motivo || '') + '</div></li>').join('') + '</ul></div></div>';
    const botoes = [{ rot: 'Fechar', v: 'cancel' }, { rot: 'Editar / incluir protocolo', v: 'editar' }, { rot: 'Alterar situação', v: 'status' }];
    if (['pendente', 'conferencia', 'duplicidade'].includes(c.status)) botoes.push({ rot: 'Confirmar lançamento', v: 'lancar', cls: 'pri' });
    modal({ titulo: (c.remetente || 'Crédito') + ' · ' + brl(c.valor), corpo, botoes, lg: true }).then((r) => {
      if (!r) return;
      if (r.v === 'editar') editar(id); else if (r.v === 'status') alterarStatus([id]); else if (r.v === 'lancar') lancar([id]);
    });
  }

  function editar(id) {
    const c = repo.creditos.get(id); if (!c) return;
    modal({
      titulo: 'Editar crédito', ok: 'Salvar',
      corpo: '<p class="hint" style="margin:0">Os dados originais da importação continuam guardados; a correção fica no histórico.</p><div class="grid2"><label class="f">Data do depósito<input type="date" name="data" value="' + esc(c.data || '') + '"></label><label class="f">Valor (R$)<input type="text" name="valor" value="' + esc(brl(c.valor, true)) + '"></label><label class="f">Tipo<input type="text" name="tipo" value="' + esc(c.tipo) + '"></label><label class="f">Código / referência<input type="text" name="referencia" value="' + esc(c.referencia || '') + '"></label></div><label class="f">Remetente<input type="text" name="remetente" value="' + esc(c.remetente) + '"></label><div class="grid2"><label class="f">Protocolo<input type="text" name="protocolo" value="' + esc((c.lancamento && c.lancamento.protocolo) || '') + '"></label><label class="f">Solicitante<input type="text" name="solicitante" value="' + esc((c.lancamento && c.lancamento.solicitante) || '') + '"></label></div><label class="f">Comentário<input type="text" name="comentario" value="' + esc((c.lancamento && c.lancamento.comentario) || '') + '"></label>' +
        (c.anoInferido ? '<label class="row small"><input type="checkbox" name="confirmarAno" checked> Confirmo o ano ' + esc((c.data || '').slice(0, 4)) + ' (era inferido)</label>' : '') +
        '<label class="f">Motivo da correção (obrigatório)<input type="text" name="motivo" placeholder="Ex.: nome completo conforme comprovante"></label>',
      validar: (v, f) => { if (!f.motivo.trim()) return 'Informe o motivo da correção.'; if (U.parseMoneyBR(f.valor) == null || U.parseMoneyBR(f.valor) <= 0) return 'Valor inválido. Use o formato 1.234,56.'; return null; },
      acao: async (v, f) => {
        await repo.editar(id, { data: f.data || null, valor: U.parseMoneyBR(f.valor), tipo: f.tipo, referencia: f.referencia || null, remetente: f.remetente, confirmarAno: !!f.confirmarAno, 'lancamento.protocolo': f.protocolo, 'lancamento.solicitante': f.solicitante.toUpperCase(), 'lancamento.comentario': f.comentario }, f.motivo.trim());
        await repo.reprocessar();
      },
    }).then((r) => { if (r) { toast('Correção salva e crédito reclassificado.'); render(); } });
  }

  function alterarStatus(ids) {
    const um = ids.length === 1 ? repo.creditos.get(ids[0]) : null;
    modal({
      titulo: 'Alterar situação de ' + ids.length + ' crédito(s)', ok: 'Alterar',
      corpo: '<label class="f">Nova situação<select name="status">' + Object.keys(S).map((k) => '<option value="' + k + '"' + (um && um.status === k ? ' selected' : '') + '>' + esc(S[k].rotulo) + '</option>').join('') + '</select></label><label class="f">N.º do protocolo (obrigatório para "Utilizado")<input type="text" name="protocolo" value="' + esc(um && um.lancamento ? um.lancamento.protocolo || '' : '') + '"></label><label class="f">Motivo (obrigatório)<input type="text" name="motivo"></label>' + (ids.length > 1 ? '<div class="alerta" style="margin:0">Esta ação altera ' + ids.length + ' créditos de uma vez.</div>' : ''),
      validar: (v, f) => (!f.motivo.trim() ? 'Informe o motivo.' : f.status === 'utilizado' && !f.protocolo.trim() ? 'Informe o protocolo.' : null),
      acao: (v, f) => repo.alterarStatus(ids, f.status, f.motivo.trim(), f.protocolo.trim() ? { protocolo: f.protocolo.trim() } : {}),
    }).then((r) => { if (r) { ui.sel.clear(); toast('Situação alterada para "' + S[r.form.status].rotulo + '".'); render(); } });
  }

  function lancar(ids) {
    const cs = ids.map((id) => repo.creditos.get(id)).filter(Boolean);
    const tot = cs.reduce((s, c) => s + c.valor, 0);

    let ok;

    else {
      const cores = lp.ids.map((id) => { const c = repo.creditos.get(id); return c.status === 'utilizado' ? ((c.evidencia && c.evidencia.cor) || '595959') : ''; });
      const wb = await C.gerarXLSX(ExcelJS, [{ nome: cfg.aba || 'ATE', modo: 'planilha', cabecalho: lp.cabecalho, tipos: lp.tipos, linhas: lp.linhas, cores, titulo: cfg.titulo, codigo: cfg.codigo, linhaCabecalho: cfg.linhaCabecalho, colunaInicial: cfg.colunaInicial }]);
      ok = await baixar(nome, new Blob([await wb.xlsx.writeBuffer()]));
    }

  async function exportarTabela(nomeBase, abas, fmt) {
    const nome = nomeBase + ' ' + stamp() + '.' + fmt;
    if (fmt === 'csv') return (await baixar(nome, C.paraCSV(abas[0].cabecalho, abas[0].linhas, abas[0].tipos))) && nome;
    const wb = await C.gerarXLSX(ExcelJS, abas.map((a) => Object.assign({ modo: 'tabela' }, a)));

  async function exportarPlanilhaCompleta() {
    const cfg = repo.config.planilha; const cols = cfg.colunas;
    const hist = repo.planilha.todos().sort((a, b) => a.n - b.n);
    const vh = (l, campo) => { switch (campo) { case 'dataDeposito': return l.d || l.dt || ''; case 'identificacao': return l.i; case 'valor': return l.v != null ? l.v : l.vt || ''; case 'protocolo': return l.p; case 'solicitante': return l.s; case 'dataConferencia': return l.dc || ''; case 'conferente': return l.c; case 'comentario': return l.o; case 'remetente': return C.extrairIdentificacao(l.i).remetente; case 'referencia': return C.extrairIdentificacao(l.i).referencia || ''; default: return ''; } };
    const linhas = hist.map((l) => cols.map((c) => vh(l, c.campo)));
    const porChave = new Map(); for (const c of repo.creditos.todos()) if (c.evidencia && c.evidencia.chave) porChave.set(c.evidencia.chave, c);
    const idx = C.indexarHistorico(hist);
    const cores = hist.map((l) => { const c = porChave.get(C.chaveLinhaPlanilha(l)); return l.f || (c && c.status === 'utilizado' ? '595959' : ''); });
    const novos = repo.creditos.todos().filter((c) => (c.status === 'lancado' || c.status === 'utilizado') && c.evidencia && c.evidencia.fonte !== 'planilha').sort((a, b) => ((a.lancamento && a.lancamento.confirmadoEm || '') < (b.lancamento && b.lancamento.confirmadoEm || '') ? -1 : 1));
    const lp = C.linhasPlanilha(novos, repo.config, { hoje: repo.hoje() });
    const porId = new Map(lp.ids.map((id, i) => [id, lp.linhas[i]]));
    for (const c of novos) { linhas.push(porId.get(c.id)); cores.push(c.status === 'utilizado' ? '595959' : ''); }
    const wb = await C.gerarXLSX(ExcelJS, [{ nome: cfg.aba || 'ATE', modo: 'planilha', cabecalho: lp.cabecalho, tipos: lp.tipos, linhas, cores, titulo: cfg.titulo, codigo: cfg.codigo, linhaCabecalho: cfg.linhaCabecalho, colunaInicial: cfg.colunaInicial }]);
    const nome = 'FIN - 00 - CONTROLE DE DEPOSITO - atualizada ' + stamp() + '.xlsx';
    if (await baixar(nome, new Blob([await wb.xlsx.writeBuffer()]))) { if (novos.length) await repo.registrarExportacao(novos.map((c) => c.id), nome, 'xlsx', 'planilha completa'); toast('Planilha gerada: ' + hist.length + ' linhas do histórico + ' + novos.length + ' lançamento(s) do aplicativo.'); render(); }
  }
  async function fazerBackup(periodo) {
    const bk = await repo.gerarBackup(periodo);

    const v = await repo.validarBackup(JSON.parse(txt));
    if (!v.ok) throw new Error('O backup gerado não passou na validação e não foi baixado: ' + v.erros[0]);
    const nome = 'backup-controle-depositos' + (periodo ? '-periodo' : '-completo') + '_' + stamp() + '.json';

      await repo.registrarBackup({ arquivo: nome, escopo: bk.escopo.tipo, periodo: periodo || null, contagens: bk.contagens, integridade: bk.integridade.valor, bytes: txt.length });

      render();
    }
  }

    rotear();
    return true;
  }
  let tAviso = null;
  function avisoSinc(ind) {
    const quem = ind && ind.sinal && ind.sinal.por; if (!quem) return;
    clearTimeout(tAviso); tAviso = setTimeout(() => toast('Atualizado agora com as alterações de ' + quem + '.'), 700);
  }

  async function iniciar() {
    if (FB) { if (typeof firebase === 'undefined') { root.innerHTML = '<div class="loading"><div class="alerta err">Não foi possível carregar o Firebase. Verifique a internet e recarregue a página.</div></div>'; return; } return iniciarFirebase(); }
    let db = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { db = await window.claude.use('db'); } catch (e) { db = null; }
      try { downloads = await window.claude.use('downloads'); } catch (e) { downloads = null; }
      try { userCap = await window.claude.use('user'); } catch (e) { userCap = null; }
    }
    const usuario = { id: null, rotulo: lsGet('operador', '') };
    if (userCap) {
      try { const me = await userCap.me(); usuario.id = me.id; nomePerfil = me.name ? me.name.split(' ')[0].toUpperCase() : ''; } catch (e) { /* sem identidade */ }
      if (db && usuario.id) { try { const pf = await db.doc('data/users/' + usuario.id + '/perfil').get(); if (pf.exists && pf.data().conferente) usuario.rotulo = pf.data().conferente; } catch (e) { /* sem perfil */ } }
      try { podeEscrever = await userCap.can('data.write'); } catch (e) { podeEscrever = null; }
    }
    if (db) { store = C.dbStore(db); modo = 'servidor'; dbRef = db; }
    else {
      try { store = C.idbStore('controle-depositos-ri-assis'); await store.list('meta'); modo = 'local'; }
      catch (e) { store = new C.MemoriaStore(); modo = 'memoria'; }
    }
    if (!(await abrirRepositorio(usuario, null))) return;
    if (modo === 'memoria') toast('Este navegador bloqueou o armazenamento local: os dados desta sessão não serão guardados. Exporte um backup antes de fechar.', true);
    if (!repo.usuario.rotulo && podeEscrever !== false) pedirOperador(true);
  }
  iniciar();
})();

</script>
